name: Release

# Inspect external publication state on every main push, including maintenance.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-state:
    name: Exact PyPI and GitHub state
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      github_required: ${{ steps.check.outputs.github_required }}
      pypi_required: ${{ steps.check.outputs.pypi_required }}
      release_required: ${{ steps.check.outputs.release_required }}
    steps:
      - name: Inspect both publication targets independently
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_REPOSITORY: kogeler/ssh-wrapper
          PYPI_PROJECT: ssh-wrapper
        with:
          script: |
            const crypto = await import("node:crypto");
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== process.env.EXPECTED_REPOSITORY) {
              throw new Error(`Refusing release inspection for ${repository}`);
            }
            if (context.ref !== "refs/heads/main" || context.eventName !== "push") {
              throw new Error("Release inspection requires a direct main push");
            }

            const read = async (path, ref = context.sha) => {
              const response = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref,
              });
              if (
                Array.isArray(response.data) || response.data.type !== "file" ||
                response.data.encoding !== "base64" ||
                typeof response.data.content !== "string"
              ) {
                throw new Error(`${path} is not a Base64 repository file`);
              }
              return Buffer.from(
                response.data.content.replace(/\n/g, ""), "base64",
              ).toString("utf8");
            };
            const version = (await read(".version")).trim();
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error(".version is not a stable semantic version");
            }
            const tagName = `v${version}`;
            const releaseNotes = (changelog) => {
              const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const heading = new RegExp(
                `^## \\[${escaped}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$`, "gm",
              );
              const headings = [...changelog.matchAll(heading)];
              if (headings.length !== 1) {
                throw new Error(`Expected one dated changelog section for ${version}`);
              }
              const remainder = changelog.slice(
                headings[0].index + headings[0][0].length,
              );
              const next = remainder.search(/^## /m);
              const section = remainder.slice(0, next < 0 ? undefined : next).trim();
              if (!section || !/^- /m.test(section)) {
                throw new Error(`Changelog section ${version} has no release entries`);
              }
              return `${section}\n\nFull changelog: ` +
                `https://github.com/${repository}/blob/${tagName}/CHANGELOG.md\n`;
            };
            const expectedTypes = new Map([
              [`ssh_wrapper-${version}-py3-none-any.whl`, "bdist_wheel"],
              [`ssh_wrapper-${version}.tar.gz`, "sdist"],
            ]);
            const checksumName = "SHA256SUMS.txt";

            async function taggedCommit() {
              let reference;
              try {
                reference = await github.rest.git.getRef({
                  ...context.repo,
                  ref: `tags/${tagName}`,
                });
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
              let object = reference.data.object;
              for (let depth = 0; object.type === "tag" && depth < 8; depth += 1) {
                const tag = await github.rest.git.getTag({
                  ...context.repo,
                  tag_sha: object.sha,
                });
                object = tag.data.object;
              }
              if (object.type !== "commit") {
                throw new Error(`Tag ${tagName} does not resolve to a commit`);
              }
              return object.sha;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100,
            });
            const matching = releases.filter((item) => item.tag_name === tagName);
            if (matching.length > 1) {
              throw new Error(`Multiple GitHub releases use ${tagName}`);
            }
            const release = matching[0] || null;
            const tagCommit = await taggedCommit();
            const published = Boolean(release && !release.draft);
            if (!published && tagCommit && tagCommit !== context.sha) {
              throw new Error(`Tag ${tagName} points to ${tagCommit}, not ${context.sha}`);
            }
            if (!release && tagCommit) {
              throw new Error(`Tag ${tagName} exists without its release`);
            }
            if (published && !tagCommit) {
              throw new Error(`Published release ${tagName} has no tag`);
            }
            const releaseCommit = published ? tagCommit : context.sha;
            const releaseVersion = (await read(".version", releaseCommit)).trim();
            if (releaseVersion !== version) {
              throw new Error(
                `Release source ${releaseCommit} contains .version ${releaseVersion}`,
              );
            }
            const notes = releaseNotes(await read("CHANGELOG.md", releaseCommit));

            const githubFiles = new Map();
            if (release) {
              if (
                release.tag_name !== tagName || release.name !== tagName ||
                release.body !== notes || release.target_commitish !== releaseCommit ||
                release.prerelease
              ) {
                throw new Error(`GitHub release ${tagName} has conflicting metadata`);
              }
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                ...context.repo,
                release_id: release.id,
                per_page: 100,
              });
              const allowed = new Set([...expectedTypes.keys(), checksumName]);
              for (const asset of assets) {
                if (!allowed.has(asset.name) || githubFiles.has(asset.name)) {
                  throw new Error(`Unexpected or duplicate GitHub asset ${asset.name}`);
                }
                if (asset.state !== "uploaded" || !Number.isInteger(asset.size) || asset.size <= 0) {
                  throw new Error(`Invalid GitHub asset metadata for ${asset.name}`);
                }
                const downloaded = await github.request(
                  "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
                  {
                    ...context.repo,
                    asset_id: asset.id,
                    headers: { accept: "application/octet-stream" },
                  },
                );
                const data = Buffer.from(downloaded.data);
                if (data.byteLength !== asset.size) {
                  throw new Error(`GitHub asset size changed for ${asset.name}`);
                }
                githubFiles.set(asset.name, {
                  size: data.byteLength,
                  sha256: crypto.createHash("sha256").update(data).digest("hex"),
                  data,
                });
              }
            }

            const project = process.env.PYPI_PROJECT;
            const response = await fetch(
              `https://pypi.org/pypi/${encodeURIComponent(project)}/${encodeURIComponent(version)}/json`,
              { headers: { accept: "application/json" } },
            );
            const pypiFiles = new Map();
            let pypiRequired;
            if (response.status === 404) {
              pypiRequired = true;
            } else {
              if (!response.ok) {
                throw new Error(`PyPI state request failed with HTTP ${response.status}`);
              }
              const metadata = await response.json();
              const normalize = (value) => value.toLowerCase().replace(/[-_.]+/g, "-");
              if (
                !metadata.info || typeof metadata.info.name !== "string" ||
                normalize(metadata.info.name) !== normalize(project) ||
                metadata.info.version !== version || !Array.isArray(metadata.urls) ||
                metadata.urls.length !== expectedTypes.size
              ) {
                throw new Error(`PyPI ${project} ${version} has conflicting metadata`);
              }
              for (const file of metadata.urls) {
                if (
                  expectedTypes.get(file.filename) !== file.packagetype ||
                  !Number.isInteger(file.size) || file.size <= 0 ||
                  !file.digests || !/^[0-9a-f]{64}$/.test(file.digests.sha256) ||
                  file.yanked !== false || pypiFiles.has(file.filename)
                ) {
                  throw new Error(`Invalid PyPI file ${file.filename}`);
                }
                pypiFiles.set(file.filename, {
                  size: file.size,
                  sha256: file.digests.sha256,
                });
              }
              if (pypiFiles.size !== expectedTypes.size) {
                throw new Error(`PyPI ${project} ${version} is missing expected files`);
              }
              pypiRequired = false;
            }

            for (const [name, published] of pypiFiles) {
              const asset = githubFiles.get(name);
              if (asset && (
                asset.size !== published.size || asset.sha256 !== published.sha256
              )) {
                throw new Error(`GitHub asset ${name} conflicts with PyPI`);
              }
            }
            if (githubFiles.has(checksumName)) {
              if (![...expectedTypes.keys()].every((name) => githubFiles.has(name))) {
                throw new Error("GitHub checksums exist before both distributions");
              }
              const expectedChecksums = [...expectedTypes.keys()].sort().map(
                (name) => `${githubFiles.get(name).sha256}  ${name}\n`,
              ).join("");
              if (githubFiles.get(checksumName).data.toString("ascii") !== expectedChecksums) {
                throw new Error("GitHub checksum asset conflicts with distribution bytes");
              }
            }

            let githubRequired = true;
            if (release && !release.draft) {
              if (!tagCommit) {
                throw new Error(`Published release ${tagName} has no tag`);
              }
              const expectedAssets = new Set([...expectedTypes.keys(), checksumName]);
              if (
                githubFiles.size !== expectedAssets.size ||
                ![...expectedAssets].every((name) => githubFiles.has(name))
              ) {
                throw new Error(`Published release ${tagName} has an incomplete asset inventory`);
              }
              if (pypiRequired) {
                throw new Error("GitHub publication exists while PyPI publication is missing");
              }
              githubRequired = false;
            }
            const releaseRequired = pypiRequired || githubRequired;
            core.setOutput("github_required", String(githubRequired));
            core.setOutput("pypi_required", String(pypiRequired));
            core.setOutput("release_required", String(releaseRequired));
            core.notice(
              `Publication state: release required=${releaseRequired}, ` +
              `PyPI required=${pypiRequired}, GitHub required=${githubRequired}`,
            );

  ci:
    name: Reusable CI gate
    needs: release-state
    if: needs.release-state.outputs.release_required == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      base_ref: ${{ github.event.before }}
      upload_distributions: true
    permissions:
      actions: read
      contents: read
      security-events: write

  publish-pypi:
    name: Publish distributions to PyPI
    needs:
      - release-state
      - ci
    if: >-
      needs.ci.result == 'success' &&
      needs.release-state.outputs.pypi_required == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ssh-wrapper/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: "true"

  publish-github:
    name: Publish matching GitHub release
    needs:
      - release-state
      - ci
      - publish-pypi
    if: >-
      always() &&
      needs.release-state.outputs.github_required == 'true' &&
      needs.ci.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download the same verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Require PyPI to match, then create checksums and notes
        run: |
          python .github/scripts/verify_pypi_release.py --dist-dir dist
          make confinement-test checksums release-notes PY=python

      - name: Recover or create the exact GitHub release without replacement
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_REPOSITORY: kogeler/ssh-wrapper
          RELEASE_NOTES_PATH: .artifacts/release-notes.md
          TARGET_SHA: ${{ github.sha }}
          VERSION_PATH: .version
        with:
          script: |
            const crypto = await import("node:crypto");
            const fs = await import("node:fs/promises");
            const path = await import("node:path");
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== process.env.EXPECTED_REPOSITORY) {
              throw new Error(`Refusing GitHub publication for ${repository}`);
            }
            const version = (await fs.readFile(process.env.VERSION_PATH, "utf8")).trim();
            const tagName = `v${version}`;
            const body = await fs.readFile(process.env.RELEASE_NOTES_PATH, "utf8");
            const target = process.env.TARGET_SHA;
            const assetPaths = [
              `dist/ssh_wrapper-${version}-py3-none-any.whl`,
              `dist/ssh_wrapper-${version}.tar.gz`,
              "dist/SHA256SUMS.txt",
            ];
            const local = new Map();
            for (const assetPath of assetPaths) {
              const data = await fs.readFile(assetPath);
              const name = path.basename(assetPath);
              if (data.byteLength === 0) {
                throw new Error(`Release asset is empty: ${name}`);
              }
              local.set(name, {
                path: assetPath,
                data,
                size: data.byteLength,
                sha256: crypto.createHash("sha256").update(data).digest("hex"),
              });
            }

            async function tagCommit() {
              let reference;
              try {
                reference = await github.rest.git.getRef({
                  ...context.repo,
                  ref: `tags/${tagName}`,
                });
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
              let object = reference.data.object;
              for (let depth = 0; object.type === "tag" && depth < 8; depth += 1) {
                const tag = await github.rest.git.getTag({
                  ...context.repo,
                  tag_sha: object.sha,
                });
                object = tag.data.object;
              }
              if (object.type !== "commit") {
                throw new Error(`Tag ${tagName} does not resolve to a commit`);
              }
              return object.sha;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100,
            });
            const matches = releases.filter((item) => item.tag_name === tagName);
            if (matches.length > 1) {
              throw new Error(`Multiple GitHub releases use ${tagName}`);
            }
            let release = matches[0] || null;
            const existingTag = await tagCommit();
            if (existingTag && existingTag !== target) {
              throw new Error(`Tag ${tagName} points to ${existingTag}`);
            }
            if (!release && existingTag) {
              throw new Error(`Tag ${tagName} exists without a recoverable draft`);
            }
            if (release) {
              if (
                !release.draft || release.name !== tagName || release.body !== body ||
                release.target_commitish !== target || release.prerelease
              ) {
                throw new Error(`Existing release ${tagName} is not an exact draft`);
              }
            } else {
              const created = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tagName,
                target_commitish: target,
                name: tagName,
                body,
                draft: true,
                prerelease: false,
              });
              release = created.data;
            }

            const existingAssets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { ...context.repo, release_id: release.id, per_page: 100 },
            );
            const existing = new Map();
            for (const asset of existingAssets) {
              const expected = local.get(asset.name);
              if (!expected || existing.has(asset.name) || asset.state !== "uploaded") {
                throw new Error(`Unexpected or duplicate draft asset ${asset.name}`);
              }
              const downloaded = await github.request(
                "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
                {
                  ...context.repo,
                  asset_id: asset.id,
                  headers: { accept: "application/octet-stream" },
                },
              );
              const data = Buffer.from(downloaded.data);
              const digest = crypto.createHash("sha256").update(data).digest("hex");
              if (
                asset.size !== expected.size || data.byteLength !== expected.size ||
                digest !== expected.sha256
              ) {
                throw new Error(`Draft asset ${asset.name} conflicts with gated bytes`);
              }
              existing.set(asset.name, asset);
            }

            for (const [name, expected] of local) {
              if (existing.has(name)) continue;
              const uploaded = await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: expected.data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": expected.size,
                },
              });
              if (
                uploaded.status !== 201 || uploaded.data.name !== name ||
                uploaded.data.state !== "uploaded" || uploaded.data.size !== expected.size
              ) {
                throw new Error(`Release asset upload was not verified: ${name}`);
              }
            }

            const finalAssets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { ...context.repo, release_id: release.id, per_page: 100 },
            );
            if (finalAssets.length !== local.size) {
              throw new Error("Final draft asset inventory is incomplete");
            }
            for (const asset of finalAssets) {
              const expected = local.get(asset.name);
              if (!expected || asset.state !== "uploaded" || asset.size !== expected.size) {
                throw new Error(`Final draft asset metadata conflicts: ${asset.name}`);
              }
              const downloaded = await github.request(
                "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
                {
                  ...context.repo,
                  asset_id: asset.id,
                  headers: { accept: "application/octet-stream" },
                },
              );
              const digest = crypto.createHash("sha256")
                .update(Buffer.from(downloaded.data)).digest("hex");
              if (digest !== expected.sha256) {
                throw new Error(`Final draft asset hash conflicts: ${asset.name}`);
              }
            }

            const published = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              tag_name: tagName,
              target_commitish: target,
              name: tagName,
              body,
              draft: false,
              prerelease: false,
            });
            if (
              published.data.tag_name !== tagName || published.data.name !== tagName ||
              published.data.body !== body || published.data.target_commitish !== target ||
              published.data.draft || published.data.prerelease
            ) {
              throw new Error(`Published release ${tagName} failed exact verification`);
            }
            const publishedTag = await tagCommit();
            if (publishedTag !== target) {
              throw new Error(`Published tag ${tagName} does not target ${target}`);
            }
            core.notice(`Published ${published.data.html_url}`);
